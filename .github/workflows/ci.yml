name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  extension:
    name: Extension (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      # Neovim is needed for the integration test (it drives a headless instance).
      # Download the official stable tarball directly — the setup-vim action trips over
      # an EXDEV cross-device rename on current runners.
      - name: Install Neovim
        run: |
          curl -fsSL -o nvim.tar.gz https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz
          tar xzf nvim.tar.gz
          echo "$PWD/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify Neovim
        run: nvim --version | head -1

      - name: Install
        working-directory: extension
        run: npm ci

      - name: Typecheck
        working-directory: extension
        run: npm run check

      - name: Test
        working-directory: extension
        run: npm test

  demo-tests:
    name: Demo fixtures (jest TDD flow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demo-tests/package-lock.json

      - name: Install
        working-directory: demo-tests
        run: npm ci

      - name: Test
        working-directory: demo-tests
        run: npm test
