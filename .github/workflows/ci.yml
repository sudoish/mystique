name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  core:
    name: Core (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: core/package-lock.json

      # Neovim is needed for the integration test (it drives a headless instance).
      # Download the official stable tarball directly — the setup-vim action trips over
      # an EXDEV cross-device rename on current runners.
      - name: Install Neovim
        run: |
          curl -fsSL -o nvim.tar.gz https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz
          tar xzf nvim.tar.gz
          echo "$PWD/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify Neovim
        run: nvim --version | head -1

      - name: Install
        working-directory: core
        run: npm ci

      - name: Typecheck
        working-directory: core
        run: npm run check

      - name: Test
        working-directory: core
        run: npm test

  extension:
    name: Extension (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      # The extension imports ../core, whose nvim.ts imports `neovim`; install core so tsc resolves it.
      - name: Install core
        working-directory: core
        run: npm ci

      - name: Install
        working-directory: extension
        run: npm ci

      - name: Typecheck
        working-directory: extension
        run: npm run check

  mcp-nvim:
    name: MCP server (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp-nvim/package-lock.json

      - name: Install Neovim
        run: |
          curl -fsSL -o nvim.tar.gz https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz
          tar xzf nvim.tar.gz
          echo "$PWD/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      # mcp-nvim imports ../core, whose nvim.ts imports `neovim`; install core so it resolves.
      - name: Install core
        working-directory: core
        run: npm ci

      - name: Install
        working-directory: mcp-nvim
        run: npm ci

      - name: Typecheck
        working-directory: mcp-nvim
        run: npm run check

      - name: Test
        working-directory: mcp-nvim
        run: npm test


  install:
    name: Installer (fresh clone → install.sh → doctor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Neovim + ripgrep
        run: |
          curl -fsSL -o nvim.tar.gz https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz
          tar xzf nvim.tar.gz
          echo "$PWD/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          sudo apt-get install -y ripgrep

      - name: CLI unit tests
        run: node --test bin/mystique.test.mjs

      # A brand-new user: empty HOME, clone of this commit piped through `sh` like curl | sh.
      # No agent is installed on the runner, so the only acceptable doctor failure is "agent".
      - name: Fresh install
        run: |
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME" && cd "$HOME"
          MYSTIQUE_REPO="$GITHUB_WORKSPACE" sh -s < "$GITHUB_WORKSPACE/install.sh" || true
          node "$HOME/.local/share/mystique/bin/mystique.mjs" doctor --json > doctor.json || true
          node -e '
            const checks = require(process.env.HOME + "/doctor.json");
            const bad = checks.filter((c) => c.level === "fail" && c.name !== "agent");
            console.log(checks.map((c) => `${c.level} ${c.name}: ${c.detail}`).join("\n"));
            if (bad.length) { console.error("doctor failures:", bad); process.exit(1); }
          '

  claude-hooks:
    name: Claude hooks (bash policy tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test
        working-directory: claude
        run: npm test

  demo-tests:
    name: Demo fixtures (jest TDD flow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demo-tests/package-lock.json

      - name: Install
        working-directory: demo-tests
        run: npm ci

      - name: Test
        working-directory: demo-tests
        run: npm test

  eval:
    name: Evaluation harness (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: eval/package-lock.json

      - name: Install
        working-directory: eval
        run: npm ci

      - name: Typecheck
        working-directory: eval
        run: npm run check

      - name: Test
        working-directory: eval
        run: npm test
